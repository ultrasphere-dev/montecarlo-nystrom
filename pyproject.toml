[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "montecarlo-nystrom"
version = "1.2.0"
description = "Monte-Carlo Nystrom method in NumPy / PyTorch"
readme = "README.md"
license = "MIT"
authors = [
  { name = "ultrasphere-dev" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.12",
  "array-api-extra>=0.9",
  "cyclopts>=3.24",
  "jax",
  "matplotlib>=3.10.7",
  "numpy>=2.2.6",
  "rich",
  "scipy",
  "types-array-api>=1.1.4",
  "ultrasphere>=2.0.4",
]
urls."Bug Tracker" = "https://github.com/ultrasphere-dev/montecarlo-nystrom/issues"
urls.Changelog = "https://github.com/ultrasphere-dev/montecarlo-nystrom/blob/main/CHANGELOG.md"
urls.documentation = "https://montecarlo-nystrom.readthedocs.io"
urls.repository = "https://github.com/ultrasphere-dev/montecarlo-nystrom"
scripts.montecarlo-nystrom = "montecarlo_nystrom.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]>=1.1.6",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
rules.import-not-found = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-argument-type = "ignore"
rules.invalid-return-type = "ignore"
rules.no-matching-overload = "ignore"
rules.unresolved-attribute = "ignore"
